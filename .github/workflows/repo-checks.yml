name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    name: .meta files, file sizes, no build outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Tools/check_repo.py
